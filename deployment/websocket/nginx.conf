upstream afrilearn_app {
    # Daphne listening port
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name elearnapi.afrilearntech.com elapi.afrilearntech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elearnapi.afrilearntech.com elapi.afrilearntech.com;
    ssl_certificate /etc/letsencrypt/live/elearnapi.afrilearntech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elearnapi.afrilearntech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;

    # HTTP + WebSocket proxy to Daphne
    location / {
        proxy_pass http://afrilearn_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /static/ {
        alias /srv/elearncore/staticfiles/;
        access_log off;
        expires 1h;
    }
}
